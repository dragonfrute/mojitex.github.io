<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mojitex</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    a {
      color: #635bff;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Welcome to Mojitex</h1>

    <p>
      This website belongs to Mojitex and supports Stripe payments.
    </p>

    <p>
      This website will soon be moved to
      <a href="https://mojitex.com">mojitex.com</a>.
    </p>
  </main>
</body>
</html>
