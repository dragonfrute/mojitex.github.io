<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mojitex - Coming Soon</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Subtle grid pattern background for a technical, modern look */
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="max-w-lg w-full bg-white/80 backdrop-blur-md border border-gray-100 rounded-3xl shadow-xl p-10 md:p-14 text-center transform transition-all hover:scale-[1.01] duration-300">
        
        <!-- Animated Icon / Decoration -->
        <div class="mx-auto w-16 h-16 bg-slate-50 rounded-2xl shadow-inner flex items-center justify-center mb-8 border border-slate-100">
            <svg class="w-8 h-8 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- Primary Message -->
        <h1 class="text-2xl md:text-3xl font-light text-gray-800 leading-relaxed mb-6">
            This site is for <span class="font-semibold text-gray-900">mojitex</span> and is powered by <span class="font-semibold text-[#635BFF]">Stripe</span>.
        </h1>

        <!-- Divider -->
        <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-6"></div>

        <!-- Secondary Message -->
        <p class="text-gray-500 text-sm md:text-base font-medium tracking-wide">
            This site will soon be moved to <br class="hidden md:block" />
            <a href="https://mojitex.com" class="inline-block mt-2 px-4 py-2 bg-slate-50 text-slate-800 rounded-full hover:bg-slate-100 hover:text-blue-600 transition-colors duration-200 border border-slate-200">
                mojitex.com
            </a>
        </p>
        
    </main>

</body>
</html>
